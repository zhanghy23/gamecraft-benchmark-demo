<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1280, initial-scale=1.0">
<title>Cannonbolf</title>
<style>
  html, body { margin: 0; padding: 0; width: 100%; height: 100%; background: #000; overflow: hidden; }
  #game { display: block; width: 100vw; height: 100vh; touch-action: none; }
  #hud {
    position: absolute;
    inset: 0;
    pointer-events: none;
    z-index: 2;
    font-family: "Arial", sans-serif;
    color: white;
  }
  #hud .centered {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    font-size: 56px;
    font-weight: 900;
    text-shadow: 0 0 12px rgba(0,0,0,0.85), 2px 2px 0 #000;
    text-align: center;
    letter-spacing: 4px;
    white-space: nowrap;
  }
  #hud .title-top {
    position: absolute;
    top: 22%;
    left: 50%;
    transform: translate(-50%, -50%);
    font-size: 96px;
    font-weight: 900;
    text-shadow: 0 0 18px rgba(0,0,0,0.9), 3px 3px 0 #000;
    letter-spacing: 8px;
    white-space: nowrap;
  }
  #hud .title-bottom {
    position: absolute;
    bottom: 14%;
    left: 50%;
    transform: translate(-50%, 50%);
    font-size: 28px;
    text-shadow: 0 0 6px rgba(0,0,0,0.85), 2px 2px 0 #000;
    letter-spacing: 3px;
    white-space: nowrap;
  }
  #hud .hud-line {
    position: absolute;
    right: 22px;
    text-align: right;
    text-shadow: 0 0 4px rgba(0,0,0,0.85), 1px 1px 0 #000;
    font-size: 22px;
    font-weight: bold;
    white-space: nowrap;
    letter-spacing: 1px;
  }
  #hud .hud-line.ammo { top: 14px; color: #FFAA55; }
  #hud .hud-line.castles { top: 48px; color: #FF7777; }
  #hud .hud-line.level { top: 82px; color: #77DDAA; }
  #hud .hint {
    position: absolute;
    left: 50%;
    bottom: 18px;
    transform: translateX(-50%);
    text-shadow: 0 0 6px rgba(0,0,0,0.85), 1px 1px 0 #000;
    font-size: 18px;
    text-align: center;
    white-space: nowrap;
    letter-spacing: 1px;
  }
</style>
  <script type="module" crossorigin src="./assets/index-BHJajdl-.js"></script>
</head>
<body>
<canvas id="game"></canvas>
<div id="hud"></div>
</body>
</html>
