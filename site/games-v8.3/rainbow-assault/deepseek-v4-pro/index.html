<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Unicorn Soldier Shooter</title>
  <style>
    body { margin: 0; background: #000; display: flex; justify-content: center; align-items: center; height: 100vh; overflow: hidden; }
    #game-container { position: relative; width: 1280px; height: 720px; }
    canvas { display: block; }
    .overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: flex; flex-direction: column; justify-content: center; align-items: center; background: rgba(0,0,0,0.7); color: white; font-family: sans-serif; }
    .hidden { display: none; }
    .btn { padding: 15px 40px; font-size: 24px; background: #f0f; border: none; color: white; cursor: pointer; }
    #gameover-overlay h1 { font-size: 48px; }
    #gameover-overlay p { font-size: 24px; margin: 20px; }
    #controls {
      position: absolute;
      bottom: 20px;
      left: 0;
      right: 0;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 50px;
      pointer-events: none;
    }
    #joystick-container {
      width: 120px;
      height: 120px;
      position: relative;
      pointer-events: auto;
      touch-action: none;
    }
    #joystick-base {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      background: rgba(255,255,255,0.3);
      position: relative;
    }
    #joystick-knob {
      width: 50px;
      height: 50px;
      border-radius: 50%;
      background: rgba(255,255,255,0.8);
      position: absolute;
      left: 35px;
      top: 35px;
    }
    .action-btn {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      background: rgba(255,255,255,0.3);
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 24px;
      color: white;
      pointer-events: auto;
      user-select: none;
      touch-action: none;
    }
  </style>
  <script type="module" crossorigin src="./assets/index-BeD7R1DL.js"></script>
</head>
<body>
  <div id="game-container">
    <canvas id="gameCanvas" width="1280" height="720"></canvas>
    <div id="menu-overlay" class="overlay">
      <button id="start-btn" class="btn">START</button>
    </div>
    <div id="gameover-overlay" class="overlay hidden">
      <h1>MISSION FAILED!</h1>
      <p>Final Score: <span id="final-score">00000</span></p>
      <button id="retry-btn" class="btn">RETRY</button>
    </div>
    <div id="controls">
      <div id="joystick-container">
        <div id="joystick-base">
          <div id="joystick-knob"></div>
        </div>
      </div>
      <div id="jump-btn" class="action-btn">JUMP</div>
      <div id="fire-btn" class="action-btn">FIRE</div>
    </div>
  </div>
</body>
</html>
