<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tube Masters</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      background: #1a1a2e;
      color: #fff;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
    }
    h1 {
      margin-bottom: 10px;
      font-size: 2.5em;
      text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
    }
    #game-container {
      position: relative;
      width: 800px;
      height: 600px;
    }
    canvas {
      display: block;
      background: #0f0f1a;
      border: 2px solid #444;
      border-radius: 4px;
    }
    #hud {
      position: absolute;
      top: 10px;
      left: 10px;
      right: 10px;
      display: flex;
      justify-content: space-between;
      pointer-events: none;
      font-size: 16px;
      font-weight: bold;
      text-shadow: 1px 1px 2px rgba(0,0,0,0.8);
    }
    #hud span {
      background: rgba(0,0,0,0.5);
      padding: 4px 12px;
      border-radius: 4px;
    }
    #overlay {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: rgba(0,0,0,0.75);
      border-radius: 4px;
      z-index: 10;
    }
    #overlay.hidden {
      display: none;
    }
    #overlay h2 {
      font-size: 2em;
      margin-bottom: 20px;
    }
    #overlay button {
      padding: 12px 40px;
      font-size: 1.2em;
      background: #e94560;
      color: #fff;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: background 0.2s;
    }
    #overlay button:hover {
      background: #ff6b6b;
    }
    #overlay p {
      margin-top: 15px;
      font-size: 0.9em;
      color: #aaa;
    }
  </style>
  <script type="module" crossorigin src="./assets/index-Bf8Pi8pO.js"></script>
</head>
<body>
  <h1>Tube Masters</h1>
  <div id="game-container">
    <canvas id="gameCanvas" width="800" height="600"></canvas>
    <div id="hud">
      <span id="scoreDisplay">Score: 0</span>
      <span id="timeDisplay">Time: 0:00</span>
      <span id="topScoreDisplay">Top: 0</span>
    </div>
    <div id="overlay">
      <h2>Tube Masters</h2>
      <button id="startBtn">Play!</button>
      <p>Use Arrow Keys or A/D to move</p>
      <p>Avoid red obstacles, collect yellow pickups, grab blue boosts!</p>
    </div>
  </div>
</body>
</html>
