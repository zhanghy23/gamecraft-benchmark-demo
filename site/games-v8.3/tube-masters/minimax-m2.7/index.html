<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tube Masters</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #1a1a2e;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    h1 {
      color: #eee;
      font-size: 2.5rem;
      margin-bottom: 1rem;
      text-shadow: 0 0 20px rgba(0, 255, 255, 0.5);
      letter-spacing: 0.2em;
    }

    #gameContainer {
      position: relative;
      width: 800px;
      height: 600px;
    }

    #gameCanvas {
      display: block;
      border: 3px solid #333;
      border-radius: 8px;
      box-shadow: 0 0 30px rgba(0, 255, 255, 0.2);
    }

    #hud {
      position: absolute;
      top: 10px;
      left: 10px;
      right: 10px;
      display: flex;
      justify-content: space-between;
      color: #fff;
      font-size: 1.2rem;
      text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.8);
      pointer-events: none;
    }

    .hud-item {
      background: rgba(0, 0, 0, 0.5);
      padding: 8px 16px;
      border-radius: 4px;
    }

    #overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.85);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      border-radius: 8px;
    }

    #overlay h2 {
      color: #0ff;
      font-size: 3rem;
      margin-bottom: 1rem;
      text-shadow: 0 0 20px rgba(0, 255, 255, 0.8);
    }

    #overlay p {
      color: #ccc;
      font-size: 1.2rem;
      margin-bottom: 2rem;
    }

    #startBtn {
      background: linear-gradient(135deg, #0ff, #00a);
      color: #fff;
      border: none;
      padding: 15px 50px;
      font-size: 1.4rem;
      border-radius: 30px;
      cursor: pointer;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      box-shadow: 0 0 20px rgba(0, 255, 255, 0.5);
      transition: transform 0.2s, box-shadow 0.2s;
    }

    #startBtn:hover {
      transform: scale(1.05);
      box-shadow: 0 0 30px rgba(0, 255, 255, 0.8);
    }

    #debug {
      position: absolute;
      bottom: 10px;
      left: 10px;
      color: #0f0;
      font-family: monospace;
      font-size: 0.8rem;
      background: rgba(0, 0, 0, 0.7);
      padding: 5px 10px;
      border-radius: 4px;
      pointer-events: none;
    }
  </style>
  <script type="module" crossorigin src="./assets/index-1MDMwSja.js"></script>
</head>
<body>
  <h1>Tube Masters</h1>
  <div id="gameContainer">
    <canvas id="gameCanvas" width="800" height="600"></canvas>
    <div id="hud">
      <div class="hud-item"><span id="scoreLabel">Score: 0</span></div>
      <div class="hud-item"><span id="timeLabel">0:00</span></div>
      <div class="hud-item"><span id="topLabel">Top: 0</span></div>
    </div>
    <div id="overlay">
      <h2>Play!</h2>
      <p>Use Arrow Keys or A/D to move. Collect pickups, avoid obstacles!</p>
      <button id="startBtn">Start Game</button>
    </div>
    <div id="debug"></div>
  </div>
</body>
</html>
