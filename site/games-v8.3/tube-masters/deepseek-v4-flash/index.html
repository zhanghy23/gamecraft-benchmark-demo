<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tube Masters</title>
<style>
  body {
    margin: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100vh;
    background: #222;
    font-family: Arial, sans-serif;
    color: white;
  }
  h1 {
    margin-bottom: 10px;
  }
  #gameContainer {
    position: relative;
    width: 800px;
    height: 600px;
  }
  canvas {
    display: block;
    background: #333;
  }
  #overlay {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(0,0,0,0.7);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
  }
  #overlay span {
    font-size: 48px;
    font-weight: bold;
    color: #0f0;
  }
  #hud {
    position: absolute;
    top: 10px;
    left: 10px;
    right: 10px;
    display: flex;
    justify-content: space-between;
    pointer-events: none;
  }
  #hud div {
    background: rgba(0,0,0,0.5);
    padding: 5px 10px;
    border-radius: 4px;
  }
  #hud .left {
    display: flex;
    gap: 20px;
  }
  #hud .right {
  }
</style>
  <script type="module" crossorigin src="./assets/index-DXuY4s8A.js"></script>
</head>
<body>
<h1>Tube Masters</h1>
<div id="gameContainer">
  <canvas id="gameCanvas" width="800" height="600"></canvas>
  <div id="overlay"><span>Play!</span></div>
  <div id="hud">
    <div class="left">
      <span id="scoreDisplay">Score: 0</span>
      <span id="topScoreDisplay">Top: 0</span>
    </div>
    <div class="right">
      <span id="timeDisplay">Time: 00:00</span>
    </div>
  </div>
</div>
</body>
</html>
