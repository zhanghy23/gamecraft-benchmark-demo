<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tube Masters</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background: #111;
      display: flex;
      flex-direction: column;
      align-items: center;
      font-family: Arial, sans-serif;
      color: #fff;
      overflow: hidden;
    }
    h1 {
      margin: 10px 0;
      font-size: 32px;
    }
    #game-container {
      position: relative;
      width: 800px;
      height: 600px;
    }
    canvas {
      display: block;
      background: #000;
    }
    #overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.7);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 10;
    }
    #overlay.hidden {
      display: none;
    }
    #overlay h2 {
      font-size: 48px;
      margin-bottom: 20px;
    }
    #overlay button {
      font-size: 24px;
      padding: 10px 30px;
      cursor: pointer;
      background: #4CAF50;
      color: white;
      border: none;
      border-radius: 5px;
    }
    #overlay button:hover {
      background: #45a049;
    }
    .hud {
      position: absolute;
      top: 10px;
      font-size: 20px;
      font-weight: bold;
      text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
      z-index: 5;
      pointer-events: none;
    }
    #hud-score { left: 10px; }
    #hud-top { left: 50%; transform: translateX(-50%); }
    #hud-time { right: 10px; }
  </style>
  <script type="module" crossorigin src="./assets/index-BOlpk6Nh.js"></script>
</head>
<body>
  <h1>Tube Masters</h1>
  <div id="game-container">
    <canvas id="game-canvas" width="800" height="600"></canvas>
    <div id="hud-score" class="hud">Score: 0</div>
    <div id="hud-top" class="hud">Top: 0</div>
    <div id="hud-time" class="hud">Time: 0:00</div>
    <div id="overlay">
      <h2 id="overlay-title">Play!</h2>
      <button id="start-btn">Start</button>
    </div>
  </div>
</body>
</html>
