<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tube Masters</title>
  <style>
    body { margin: 0; padding: 20px; font-family: sans-serif; background: #111; color: white; display: flex; flex-direction: column; align-items: center; }
    h1 { margin: 0 0 12px 0; }
    #game-container { position: relative; width: 800px; height: 600px; }
    canvas { width: 800px; height: 600px; display: block; background: #222; }
    #overlay { position: absolute; inset: 0; background: rgba(0,0,0,0.85); display: flex; flex-direction: column; align-items: center; justify-content: center; }
    #overlay.hidden { display: none; }
    #start-btn { padding: 16px 32px; font-size: 22px; cursor: pointer; border: none; background: #00bb77; color: white; border-radius: 8px; }
    #hud { position: absolute; top: 10px; left: 10px; right: 10px; display: flex; justify-content: space-between; font-size: 18px; pointer-events: none; }
  </style>
  <script type="module" crossorigin src="./assets/index-DMpXXApm.js"></script>
</head>
<body>
  <h1>Tube Masters</h1>
  <div id="game-container">
    <canvas id="game" width="800" height="600"></canvas>
    <div id="hud">
      <div id="score">Score: 0</div>
      <div id="time">Time: 0:00</div>
      <div id="top">Top: 0</div>
    </div>
    <div id="overlay">
      <h2>Tube Masters</h2>
      <p>Use LEFT / RIGHT arrow keys to dodge obstacles</p>
      <p>Collect yellow orbs for score, green orbs for speed boost</p>
      <button id="start-btn">Play!</button>
    </div>
  </div>
</body>
</html>
