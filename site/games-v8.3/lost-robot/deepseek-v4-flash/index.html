<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lost Robot</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #000;
      overflow: hidden;
      font-family: 'Courier New', monospace;
      color: #fff;
    }
    #game-container {
      position: relative;
      width: 1280px;
      height: 720px;
      margin: 0 auto;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
      background: #111;
    }
    .ui-screen {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #000;
      z-index: 10;
    }
    .ui-screen.hidden {
      display: none;
    }
    .ui-screen h1 {
      font-size: 4em;
      margin-bottom: 0.5em;
      letter-spacing: 0.2em;
      color: #0f0;
    }
    .ui-screen h2 {
      font-size: 2em;
      margin-bottom: 1em;
      color: #0ff;
    }
    .btn {
      font-family: inherit;
      font-size: 1.5em;
      padding: 0.5em 1.5em;
      cursor: pointer;
      border: 2px solid #0f0;
      background: transparent;
      color: #0f0;
      margin: 0.5em;
    }
    .btn:disabled {
      opacity: 0.4;
      cursor: default;
    }
    .btn:not(:disabled):hover {
      background: #0f0;
      color: #000;
    }
    .map-btn {
      display: block;
      width: 300px;
      text-align: left;
      padding: 0.5em 1em;
      border: 1px solid #0ff;
      background: transparent;
      color: #0ff;
      font-family: inherit;
      font-size: 1.2em;
      margin: 0.3em;
      cursor: pointer;
    }
    .map-btn:hover {
      background: #0ff;
      color: #000;
    }
    .map-btn .line {
      display: block;
    }
  </style>
  <script type="module" crossorigin src="./assets/index-Dz2LPQ7m.js"></script>
</head>
<body>
  <div id="game-container">
    <canvas id="game-canvas" width="1280" height="720"></canvas>
    <!-- Title screen -->
    <div id="title-screen" class="ui-screen">
      <h1>LOST ROBOT</h1>
      <button id="start-btn" class="btn" disabled>Loading … Please wait.</button>
    </div>
    <!-- Level select screen -->
    <div id="level-select" class="ui-screen hidden">
      <h2>CHOOSE A MAP</h2>
      <div id="map-buttons"></div>
    </div>
  </div>
</body>
</html>
