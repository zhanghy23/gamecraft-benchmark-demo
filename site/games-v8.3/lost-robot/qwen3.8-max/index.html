<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lost Robot</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#111;font-family:sans-serif}
#game-container{position:relative;width:100vw;height:100vh;display:flex;align-items:center;justify-content:center}
canvas{display:block;background:#222}
.screen-overlay{position:absolute;top:0;left:0;width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;background:rgba(0,0,0,0.92);color:#fff;z-index:10}
.hidden{display:none!important}
h1{font-size:3rem;margin-bottom:1.5rem;letter-spacing:0.2em}
h2{font-size:2rem;margin-bottom:1.5rem;letter-spacing:0.1em}
button{padding:0.75rem 2rem;font-size:1.2rem;cursor:pointer;border:2px solid #0ff;background:transparent;color:#0ff;margin:0.5rem;border-radius:4px;transition:background 0.2s}
button:hover:not(:disabled){background:rgba(0,255,255,0.15)}
button:disabled{opacity:0.5;cursor:not-allowed}
.map-buttons{display:flex;gap:1rem;flex-wrap:wrap;justify-content:center;margin-top:1rem}
.map-btn{text-align:left;min-width:180px;padding:1rem;line-height:1.6}
.map-btn .map-num{font-size:1.3rem;font-weight:bold;color:#0ff}
.map-btn .map-info{font-size:0.9rem;color:#aaa}
</style>
  <script type="module" crossorigin src="./assets/index-DGKZktmq.js"></script>
</head>
<body>
<div id="game-container">
<canvas id="gameCanvas" width="1280" height="720"></canvas>
<div id="title-screen" class="screen-overlay">
<h1>LOST ROBOT</h1>
<button id="start-btn" disabled>Loading &hellip; Please wait.</button>
</div>
<div id="level-select" class="screen-overlay hidden">
<h2>CHOOSE A MAP</h2>
<div id="map-buttons" class="map-buttons"></div>
</div>
</div>
</body>
</html>
