<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dewdrop Farm</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #2c5e2e;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      font-family: sans-serif;
    }
    #game {
      width: 1280px;
      height: 720px;
      background: #a8d5a2;
      border-radius: 12px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      box-shadow: 0 0 20px rgba(0,0,0,0.5);
    }
    #tabs {
      display: flex;
      background: #4a7c4f;
    }
    .tab {
      padding: 12px 24px;
      background: #5c8a5c;
      border: none;
      color: white;
      font-size: 20px;
      cursor: pointer;
      flex: 1;
      text-align: center;
    }
    .tab.active {
      background: #3d6b3d;
      font-weight: bold;
      text-decoration: underline;
    }
    #content {
      flex: 1;
      display: flex;
      position: relative;
    }
    .screen {
      display: none;
      width: 100%;
      height: 100%;
    }
    .screen.visible {
      display: flex;
    }
    #tendScreen {
      display: flex;
      flex-direction: column;
    }
    #farmArea {
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    canvas {
      border: 2px solid #333;
      background: #7ca87c;
    }
    #toolbar {
      display: flex;
      justify-content: center;
      gap: 10px;
      padding: 10px;
      background: #e0cfa0;
    }
    .tool, .slot {
      width: 64px;
      height: 64px;
      border: 3px solid #555;
      border-radius: 8px;
      background: #eee;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      position: relative;
      cursor: pointer;
    }
    .tool.active, .slot.active {
      border-color: gold;
      box-shadow: 0 0 8px gold;
    }
    .key-label {
      position: absolute;
      top: 2px;
      left: 4px;
      font-size: 12px;
      font-weight: bold;
      color: #333;
    }
    .amount {
      position: absolute;
      bottom: 2px;
      right: 4px;
      background: rgba(0,0,0,0.7);
      color: white;
      font-size: 12px;
      padding: 1px 3px;
      border-radius: 4px;
    }
    #cashDisplay {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 8px;
      background: #f0e68c;
      font-size: 24px;
      font-weight: bold;
    }
    #buyScreen, #sellScreen, #geekScreen {
      flex-direction: column;
      padding: 20px;
      overflow-y: auto;
    }
    .store-entry, .market-entry {
      border: 1px solid #666;
      padding: 8px;
      margin: 4px 0;
      background: #f5f5dc;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .info-panel {
      background: #f5f5dc;
      padding: 20px;
      border-radius: 8px;
      font-size: 20px;
    }
    .hidden { display: none !important; }
  </style>
  <script type="module" crossorigin src="./assets/index-uczR-2sU.js"></script>
</head>
<body>
  <div id="game">
    <div id="tabs">
      <button class="tab" data-screen="tend">Tend</button>
      <button class="tab" data-screen="buy">Buy</button>
      <button class="tab" data-screen="sell">Sell</button>
      <button class="tab" data-screen="geek">Geek</button>
    </div>
    <div id="content">
      <div id="tendScreen" class="screen">
        <div id="farmArea"><canvas id="farmCanvas" width="600" height="600"></canvas></div>
        <div id="toolbar">
          <div class="tool" id="toolHoe" data-tool="hoe"><span class="key-label">1</span>🌾</div>
          <div class="tool" id="toolWater" data-tool="water"><span class="key-label">2</span>💧</div>
          <div class="slot" id="slot0" data-slot="0"><span class="key-label">3</span></div>
          <div class="slot" id="slot1" data-slot="1"><span class="key-label">4</span></div>
          <div class="slot" id="slot2" data-slot="2"><span class="key-label">5</span></div>
          <div class="slot" id="slot3" data-slot="3"><span class="key-label">6</span></div>
        </div>
        <div id="cashDisplay">🪙 <span id="cashValue">0</span></div>
      </div>
      <div id="buyScreen" class="screen"></div>
      <div id="sellScreen" class="screen"></div>
      <div id="geekScreen" class="screen"></div>
    </div>
  </div>
</body>
</html>
