<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dewdrop Farm</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#2d5a1e;font-family:sans-serif;display:flex;justify-content:center;align-items:center;min-height:100vh;color:#fff;overflow:hidden}
#app{position:relative;width:1280px;height:720px;background:#3a7a28;border-radius:8px;overflow:hidden;box-shadow:0 0 30px rgba(0,0,0,0.5)}
#menu-screen{position:absolute;top:0;left:0;width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;background:linear-gradient(135deg,#2d5a1e,#4a8c3f);z-index:100}
#menu-screen h1{font-size:64px;color:#ffd700;text-shadow:3px 3px 6px rgba(0,0,0,0.5);margin-bottom:40px}
#menu-screen button{padding:15px 40px;font-size:24px;background:#ffd700;color:#2d5a1e;border:none;border-radius:8px;cursor:pointer;font-weight:bold}
#menu-screen button:hover{background:#ffed4a}
#game-screen{display:none;width:100%;height:100%;flex-direction:column}
#header{display:flex;align-items:center;padding:8px 16px;background:rgba(0,0,0,0.3);gap:16px;height:50px}
.nav-btn{padding:6px 16px;background:#555;color:#fff;border:2px solid transparent;border-radius:4px;cursor:pointer;font-size:14px}
.nav-btn.active{background:#ffd700;color:#2d5a1e;border-color:#fff;font-weight:bold}
#cash-display{display:flex;align-items:center;gap:6px;margin-left:auto;font-size:18px;font-weight:bold}
.coin-icon{width:20px;height:20px;background:#ffd700;border-radius:50%;border:2px solid #daa520;display:inline-block}
#time-display{font-size:16px;color:#ddd}
#main-area{display:flex;flex:1;overflow:hidden}
#canvas-wrap{flex:1;display:flex;align-items:center;justify-content:center;position:relative}
canvas{background:#4a8c3f;border-radius:4px;cursor:pointer}
#sidebar{width:320px;padding:12px;background:rgba(0,0,0,0.2);overflow-y:auto;display:flex;flex-direction:column;gap:12px}
.panel{display:none;background:rgba(255,255,255,0.1);border-radius:8px;padding:12px}
.panel.visible{display:block}
#toolbar{display:flex;gap:6px;padding:8px 16px;background:rgba(0,0,0,0.3);height:60px;align-items:center}
.tool-btn{width:44px;height:44px;background:#666;border:2px solid #888;border-radius:6px;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative;color:#fff;font-size:10px}
.tool-btn.active{border-color:#ffd700;background:#555;box-shadow:0 0 8px rgba(255,215,0,0.5)}
.tool-btn .key-label{position:absolute;top:-8px;right:-8px;background:#333;color:#ffd700;font-size:10px;padding:1px 4px;border-radius:3px}
.tool-btn canvas{width:32px;height:32px}
.store-item,.market-item{display:flex;align-items:center;justify-content:space-between;padding:8px;margin:4px 0;background:rgba(255,255,255,0.1);border-radius:4px;cursor:pointer}
.store-item:hover,.market-item:hover{background:rgba(255,255,255,0.2)}
.store-item.locked{opacity:0.7;cursor:default}
.buy-btn,.sell-btn{padding:4px 12px;background:#4CAF50;color:#fff;border:none;border-radius:4px;cursor:pointer}
.sell-btn{background:#2196F3}
.info-line{margin:4px 0;font-size:14px}
.amount-badge{background:#e74c3c;color:#fff;border-radius:10px;padding:1px 6px;font-size:11px;position:absolute;bottom:-4px;right:-4px}
</style>
  <script type="module" crossorigin src="./assets/index-DrKz0lPx.js"></script>
</head>
<body>
<div id="app">
  <div id="menu-screen">
    <h1>Dewdrop Farm</h1>
    <button id="new-game-btn">New Game</button>
  </div>
  <div id="game-screen">
    <div id="header">
      <button class="nav-btn active" data-screen="tend">Tend</button>
      <button class="nav-btn" data-screen="buy">Buy</button>
      <button class="nav-btn" data-screen="sell">Sell</button>
      <button class="nav-btn" data-screen="geek">Info</button>
      <span id="time-display">Spring, Day 1</span>
      <div id="cash-display"><span class="coin-icon"></span><span id="cash-value">100</span></div>
    </div>
    <div id="main-area">
      <div id="canvas-wrap"><canvas id="farm-canvas" width="600" height="600"></canvas></div>
      <div id="sidebar">
        <div id="store-panel" class="panel"></div>
        <div id="market-panel" class="panel"></div>
        <div id="info-panel" class="panel"></div>
      </div>
    </div>
    <div id="toolbar"></div>
  </div>
</div>
</body>
</html>
