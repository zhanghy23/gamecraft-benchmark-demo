<head>

  <title>Dewdrop Farm</title>
  <style>
    :root{font-family:Verdana,Arial,sans-serif;color:#25351f;background:#cfe9b2}body{margin:0;min-height:100vh;background:linear-gradient(#bde6ff,#dbf5bc 42%,#b8dc86)}button{font:inherit;cursor:pointer;border:2px solid #6d8f47;border-radius:10px;background:#fff8d7;color:#25351f;padding:8px 12px;box-shadow:0 2px 0 #6d8f47}button.active{background:#ffe675;outline:3px solid #fff}.page{max-width:1180px;margin:0 auto;padding:16px}.top{display:flex;gap:14px;align-items:center;justify-content:space-between;flex-wrap:wrap}.title{font-size:42px;font-weight:900;color:#285b25;text-shadow:2px 2px #fff}.nav,.tools,.money{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.money{font-weight:800;background:#fffbe0;border:3px solid #7e9d48;border-radius:14px;padding:8px 12px}.coin-tile{display:inline-grid;place-items:center;width:28px;height:28px;border-radius:6px;background:#f8cc39}.panel{background:rgba(255,255,238,.94);border:3px solid #78954a;border-radius:18px;padding:14px;margin-top:14px}.hidden{display:none!important}.main{display:grid;grid-template-columns:1fr 300px;gap:16px;margin-top:14px}.farm-area{display:flex;flex-direction:column;gap:12px}.farm-grid{display:grid;grid-template-columns:repeat(6,76px);grid-template-rows:repeat(6,76px);gap:7px;background:#7aa04e;border:5px solid #517033;border-radius:18px;padding:10px;width:max-content}.plot{position:relative;width:76px;height:76px;border-radius:10px;border:2px solid #527033;background:#6fbd52;overflow:hidden;display:grid;place-items:center}.plot.tilled{background:repeating-linear-gradient(45deg,#8a5b35 0 8px,#9b6a41 8px 16px)}.plot .fert{position:absolute;left:8px;top:8px;width:30px;height:26px;border-radius:5px;background:#5c3521;border:2px solid #3b2114}.plot .water{position:absolute;inset:0;background:rgba(44,145,255,.42)}.crop-sprite,.animal-sprite,.item-sprite{position:relative;z-index:2;font-size:34px;line-height:1}.animal-sprite{position:absolute;right:5px;bottom:3px;font-size:32px}.tools{background:#e9f8c8;border:3px solid #739043;border-radius:16px;padding:10px}.tool{min-width:58px;min-height:58px;position:relative}.key{position:absolute;left:4px;top:2px;font-size:12px;background:#2d4728;color:white;border-radius:8px;padding:1px 5px}.slot-pic{position:relative;display:grid;place-items:center;min-height:42px}.seed-packet{position:absolute;width:34px;height:38px;background:#f6e7ad;border:2px solid #ad8551;border-radius:4px;transform:rotate(-5deg);z-index:0}.amount-sticker{position:absolute;right:-7px;bottom:-5px;z-index:5;background:#ffef66;border:2px solid #755f24;border-radius:14px;font-size:13px;font-weight:bold;min-width:20px}.store-grid,.market-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}.card{background:#fffef0;border:3px solid #91a95a;border-radius:15px;padding:12px;min-height:128px}.card-name{font-weight:900;font-size:18px}.unlock{font-size:13px;color:#83511d;margin:6px 0}.price{font-weight:800;margin:7px 0}.inventory-list{display:flex;gap:8px;flex-wrap:wrap}.info-line{font-size:18px;margin:6px 0}.side{display:flex;flex-direction:column;gap:12px}.hint{font-size:13px;color:#3d542f}@media(max-width:900px){.main{grid-template-columns:1fr}.farm-grid{grid-template-columns:repeat(6,13vw);grid-template-rows:repeat(6,13vw)}.plot{width:13vw;height:13vw}.side{max-width:640px}}
