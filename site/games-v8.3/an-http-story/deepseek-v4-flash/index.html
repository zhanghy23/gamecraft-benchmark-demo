<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>An HTTP Story</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { overflow: hidden; background: #1a1a2e; font-family: 'Courier New', monospace; color: #e0e0e0; }
    #app { width: 100vw; height: 100vh; position: relative; }
    #canvas { display: block; width: 100%; height: 100%; }
    .overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; }
    .overlay.active { pointer-events: auto; }
    .modal-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); display: flex; align-items: center; justify-content: center; pointer-events: auto; }
    .modal { background: #16213e; border: 2px solid #0f3460; padding: 20px; max-width: 500px; width: 90%; box-shadow: 0 0 20px rgba(0,0,0,0.5); position: relative; }
    .modal h2 { margin-top: 0; }
    .modal-close { position: absolute; top: 10px; right: 10px; cursor: pointer; font-size: 20px; background: none; border: none; color: #e0e0e0; }
    .modal-close:hover { color: #f00; }
    .download-bar { position: absolute; bottom: 0; left: 0; width: 100%; background: #0f3460; padding: 10px; text-align: center; display: none; }
    .download-bar.active { display: block; }
    .download-item { background: #1a1a2e; margin: 5px auto; padding: 10px; width: 200px; cursor: pointer; border: 1px solid #0f3460; }
    .download-item:hover { background: #16213e; }
    .dialogue-panel { position: absolute; bottom: 50px; left: 50%; transform: translateX(-50%); background: rgba(0,0,0,0.8); padding: 15px 20px; border: 1px solid #0f3460; max-width: 400px; text-align: center; display: none; pointer-events: auto; }
    .dialogue-panel.active { display: block; }
    .landing-page { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; background: #1a1a2e; z-index: 10; }
    .landing-page h1 { font-size: 2em; margin-bottom: 20px; }
    .landing-page button { margin: 10px; padding: 10px 20px; background: #0f3460; border: none; color: #e0e0e0; cursor: pointer; font-size: 1em; }
    .landing-page button:hover { background: #16213e; }
    .error-notification { background: #ff4444; padding: 5px 10px; margin-top: 10px; cursor: pointer; display: none; }
    .error-notification.active { display: inline-block; }
    .subscriber-section { display: none; }
    .subscriber-section.active { display: block; }
    .non-subscriber-section { display: block; }
    .non-subscriber-section.hidden { display: none; }
    .custom-level-textarea { width: 100%; height: 150px; background: #0f3460; color: #e0e0e0; border: 1px solid #16213e; margin: 10px 0; padding: 5px; }
    .play-btn { background: #0f3460; color: #e0e0e0; border: none; padding: 8px 16px; cursor: pointer; }
    .play-btn:hover { background: #16213e; }
    .win-window { text-align: center; }
    .win-window .icon { font-size: 3em; }
  </style>
  <script type="module" crossorigin src="./assets/index-CAObBV1j.js"></script>

  <div id="app">
