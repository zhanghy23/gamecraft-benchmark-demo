<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Prism Paddock</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      font-family: 'Georgia', serif;
    }
    #game-container {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #87CEEB 0%, #98FB98 100%);
    }
    #game-canvas {
      display: block;
    }
    .ui-overlay {
      position: fixed;
      pointer-events: none;
    }
    #start-screen {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(135deg, #FF6B6B 0%, #FFA500 25%, #FFFF00 50%, #90EE90 75%, #87CEEB 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 100;
    }
    #start-screen h1 {
      font-size: 4rem;
      color: white;
      text-shadow: 3px 3px 6px rgba(0,0,0,0.4);
      margin-bottom: 2rem;
    }
    #start-screen a {
      font-size: 1.5rem;
      color: white;
      text-decoration: underline;
      cursor: pointer;
      pointer-events: auto;
      text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
    }
    #start-screen a:hover {
      color: #FFE4B5;
    }
    .hidden {
      display: none !important;
    }
  </style>
  <script type="module" crossorigin src="./assets/index-BejhfCac.js"></script>
</head>
<body>
  <div id="game-container">
    <canvas id="game-canvas" width="1280" height="720"></canvas>
  </div>
  <div id="start-screen">
    <h1>Prism Paddock</h1>
    <a id="start-link">Click to start</a>
  </div>
</body>
</html>
