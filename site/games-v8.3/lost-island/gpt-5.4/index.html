<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lost Island Survival</title>
  <style>
    html, body {
      margin: 0;
      min-height: 100%;
      background: #07131f;
      color: white;
      font-family: Arial, Helvetica, sans-serif;
      overflow: hidden;
    }
    #app {
      width: 100vw;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at center, #143454 0%, #07131f 70%);
    }
    #gameCanvas {
      display: none;
      width: min(100vw, 1280px);
      height: min(100vh, 720px);
      max-width: 1280px;
      max-height: 720px;
      image-rendering: auto;
      box-shadow: 0 0 28px rgba(0, 0, 0, 0.55);
      background: #06243e;
    }
    .screen {
      width: min(100vw, 1280px);
      height: min(100vh, 720px);
      max-width: 1280px;
      max-height: 720px;
      box-sizing: border-box;
      padding: 48px 72px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      background: linear-gradient(180deg, #0b3654 0%, #0a1c2c 100%);
      box-shadow: 0 0 28px rgba(0, 0, 0, 0.55);
    }
    #startScreen h1, #messageScreen h1 {
      font-size: 84px;
      letter-spacing: 8px;
      margin: 0 0 24px;
      text-transform: uppercase;
      color: #ffd36a;
      text-shadow: 0 4px 0 #553915;
    }
    #startScreen p, #messageScreen p {
      font-size: 24px;
      line-height: 1.45;
      max-width: 900px;
      margin: 10px 0;
    }
    #startPrompt {
      margin-top: 36px;
      font-weight: bold;
      color: #ffffff;
      animation: pulse 1.1s ease-in-out infinite alternate;
    }
    #messageScreen {
      display: none;
    }
    @keyframes pulse {
      from { opacity: 0.45; }
      to { opacity: 1; }
    }
  </style>
  <script type="module" crossorigin src="./assets/index-2TPRsbuZ.js"></script>
</head>
<body>
  <div id="app">
    <section id="startScreen" class="screen">
      <h1>Lost</h1>
      <p>You wake on a lonely island with an empty stomach and a broken rescue radio.</p>
      <p>Search the island for food and find the transmitter, antenna, and battery before hunger wins.</p>
      <p>Move with WASD or arrow keys. Press Space or E to gather nearby food and radio parts.</p>
      <p id="startPrompt">Press space to start</p>
    </section>
    <canvas id="gameCanvas" width="1280" height="720" aria-label="Lost Island Survival game canvas"></canvas>
    <section id="messageScreen" class="screen">
      <h1 id="messageHeading"></h1>
      <p id="messageText"></p>
    </section>
  </div>
</body>
</html>
