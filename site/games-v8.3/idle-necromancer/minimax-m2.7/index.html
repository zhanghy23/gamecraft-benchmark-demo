<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Necromancer Card Merge Suite</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #0a0a0f;
      font-family: 'Courier New', monospace;
    }
    #gameContainer {
      position: relative;
      width: 100vw;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    #gameCanvas {
      display: block;
      background: #0a0a0f;
    }
    #uiOverlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }
    #suspendedScreen {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(10, 10, 15, 0.85);
      display: none;
      align-items: flex-end;
      justify-content: center;
      padding-bottom: 120px;
      pointer-events: auto;
      cursor: pointer;
    }
    #suspendedScreen.visible { display: flex; }
    #suspendedScreen p {
      color: #aa3333;
      font-size: 24px;
      text-align: center;
      text-shadow: 0 0 10px #aa3333;
    }
    #infoPanel {
      position: absolute;
      bottom: 10px;
      left: 50%;
      transform: translateX(-50%);
      color: #888;
      font-size: 12px;
      text-align: center;
      min-height: 20px;
    }
    #mobileControls {
      position: absolute;
      bottom: 20px;
      right: 20px;
      pointer-events: auto;
    }
    #mobileControls.hidden { display: none; }
    #modeButton {
      background: #1a1a2e;
      color: #aa3333;
      border: 2px solid #aa3333;
      padding: 12px 20px;
      font-family: 'Courier New', monospace;
      font-size: 14px;
      cursor: pointer;
    }
    #resetButton {
      background: #1a1a2e;
      color: #666;
      border: 2px solid #444;
      padding: 8px 16px;
      font-family: 'Courier New', monospace;
      font-size: 12px;
      cursor: pointer;
      margin-top: 10px;
      pointer-events: auto;
    }
    #autoplayButton {
      background: #1a1a2e;
      color: #666;
      border: 2px solid #444;
      padding: 8px 16px;
      font-family: 'Courier New', monospace;
      font-size: 12px;
      cursor: pointer;
      margin-top: 10px;
      pointer-events: auto;
    }
  </style>
  <script type="module" crossorigin src="./assets/index-D-L6aZpF.js"></script>
</head>
<body>
  <div id="gameContainer">
    <canvas id="gameCanvas"></canvas>
    <div id="uiOverlay">
      <div id="suspendedScreen"><p>Click on the Screen to Continue the Game</p></div>
      <div id="infoPanel"></div>
      <div id="mobileControls">
        <button id="modeButton">MOVE CARDS</button>
        <button id="resetButton">RESET</button>
        <button id="autoplayButton">AUTOPLAY OFF</button>
      </div>
    </div>
  </div>
</body>
</html>
