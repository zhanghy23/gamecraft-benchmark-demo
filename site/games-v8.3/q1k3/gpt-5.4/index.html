<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Q1K3</title>
    <style>
      html, body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #050406;
        color: #f2e2bd;
        font-family: Impact, Haettenschweiler, 'Arial Narrow Bold', sans-serif;
      }
      #app {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        background: radial-gradient(circle at center, #211712 0%, #060405 72%);
      }
      canvas {
        width: 100vw;
        height: 100vh;
        display: block;
        image-rendering: pixelated;
        cursor: crosshair;
      }
      .overlay {
        position: fixed;
        inset: 0;
        pointer-events: none;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        color: #ffdd9a;
        text-shadow: 0 4px 0 #221006, 0 0 24px #d53;
        letter-spacing: 0.08em;
      }
      .hidden { display: none !important; }
      #titleText {
        font-size: clamp(72px, 13vw, 170px);
        line-height: 0.88;
      }
      #startText {
        margin-top: 26px;
        font-size: clamp(24px, 4vw, 48px);
        animation: pulse 1.1s infinite alternate;
      }
      #centerMessage {
        font-size: clamp(34px, 7vw, 86px);
        color: #ffd3c6;
        text-shadow: 0 3px 0 #360505, 0 0 18px #f00;
      }
      #endHeading {
        font-size: clamp(58px, 10vw, 132px);
      }
      #endText {
        margin-top: 18px;
        font-size: clamp(22px, 3vw, 44px);
      }
      #hud {
        position: fixed;
        inset: 0;
        pointer-events: none;
        font-family: Impact, Haettenschweiler, 'Arial Narrow Bold', sans-serif;
        color: #ffdca3;
        text-shadow: 0 3px 0 #1a0802, 0 0 8px #000;
      }
      .hudBox {
        position: absolute;
        bottom: 20px;
        min-width: 170px;
        padding: 10px 18px;
        border-top: 3px solid rgba(255, 202, 112, 0.65);
        background: linear-gradient(180deg, rgba(31, 14, 7, 0.35), rgba(0, 0, 0, 0.65));
        font-size: clamp(24px, 3vw, 44px);
      }
      #healthHud { left: 22px; }
      #ammoHud { right: 22px; text-align: right; }
      #pickupMessage {
        position: absolute;
        top: 16%;
        left: 0;
        right: 0;
        text-align: center;
        font-size: clamp(22px, 3vw, 42px);
        color: #fff0b0;
      }
      @keyframes pulse { from { opacity: .52; transform: scale(.99); } to { opacity: 1; transform: scale(1.03); } }
    </style>
    <script type="module" crossorigin src="./assets/index-BwUQq1ov.js"></script>
  </head>
  <body>
    <div id="app"><canvas id="gameCanvas"></canvas></div>
    <div id="startOverlay" class="overlay"><div id="titleText">Q1K3</div><div id="startText">CLICK TO START</div></div>
    <div id="centerOverlay" class="overlay hidden"><div id="centerMessage"></div></div>
    <div id="endOverlay" class="overlay hidden"><div id="endHeading">THE END</div><div id="endText">THANKS FOR PLAYING ❤</div></div>
    <div id="hud"><div id="pickupMessage"></div><div id="healthHud" class="hudBox"></div><div id="ammoHud" class="hudBox"></div></div>
  </body>
</html>
