<!doctype html>
<html lang='en'>
  <head>
    <meta charset='UTF-8'>
    <meta name='viewport' content='width=device-width, initial-scale=1.0'>
    <title>Necrotic Commander</title>
    <style>
      html, body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #000;
        color: #e6d0d0;
        font-family: Georgia, 'Times New Roman', serif;
        user-select: none;
        touch-action: none;
      }
      #gameRoot {
        position: relative;
        width: min(100vw, calc(100vh * 16 / 9));
        height: min(100vh, calc(100vw * 9 / 16));
        margin: auto;
        top: 50%;
        transform: translateY(-50%);
        background: #000;
        overflow: hidden;
        box-shadow: 0 0 42px #240000;
      }
      #gameCanvas {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        display: block;
        background: #060606;
      }
      #introMenu {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 26px;
        background: #000;
        z-index: 4;
      }
      #introTitle {
        color: #d7cccc;
        font-size: clamp(40px, 6vw, 82px);
        text-shadow: 0 0 20px #8b0000;
        letter-spacing: 2px;
        margin-bottom: 18px;
      }
      .menuButton {
        min-width: 290px;
        padding: 16px 28px;
        border: 3px solid #720000;
        border-radius: 10px;
        background: #8e1010;
        color: #ffd0d0;
        font-size: 28px;
        font-family: inherit;
        cursor: pointer;
        box-shadow: inset 0 0 16px #280000, 0 0 16px #2b0000;
      }
      .menuButton:hover { background: #b31818; }
      #uiLayer {
        position: absolute;
        inset: 0;
        pointer-events: none;
        z-index: 3;
        display: none;
      }
      #hud {
        position: absolute;
        left: 24px;
        top: 14px;
        font-size: 22px;
        line-height: 1.35;
        color: #f0dfdf;
        text-shadow: 2px 2px 2px #000;
      }
      #spellBar {
        position: absolute;
        left: 50%;
        bottom: 16px;
        transform: translateX(-50%);
        display: flex;
        gap: 12px;
        pointer-events: auto;
      }
      .spellButton {
        min-width: 132px;
        height: 48px;
        border: 3px solid #5c0000;
        border-radius: 8px;
        background: #871010;
        color: #ffb7b7;
        font-size: 16px;
        font-family: inherit;
        cursor: pointer;
        box-shadow: inset 0 0 12px #280000;
      }
      .spellButton.selected { border-color: #d0a020; }
      .spellButton.held {
        background: #4e207d;
        color: #ff4cff;
        border-color: #a842b9;
      }
    </style>
    <script type="module" crossorigin src="./assets/index-BBPEMO2P.js"></script>
  </head>
  <body>
    <div id='gameRoot'>
      <canvas id='gameCanvas' width='1280' height='720'></canvas>
      <div id='introMenu'>
        <div id='introTitle'>Necrotic Commander</div>
        <button class='menuButton' data-mode='guided'>Guided Mode</button>
        <button class='menuButton' data-mode='endless'>Endless Mode</button>
        <button class='menuButton' data-mode='certain'>Certain Death Mode</button>
      </div>
      <div id='uiLayer'>
        <div id='hud'>
          <div id='healthText'>Health (100)</div>
          <div id='manaText'>Mana (100)</div>
          <div id='waveText'>Peasant wave 0</div>
        </div>
        <div id='spellBar'>
          <button class='spellButton' data-spell='1'>1 Nether Bolt</button>
          <button class='spellButton' data-spell='2'>2 Drain Soul</button>
          <button class='spellButton' data-spell='3'>3 Raise Dead</button>
          <button class='spellButton' data-spell='4'>4 Corpse Bomb</button>
        </div>
      </div>
    </div>
  </body>
</html>
