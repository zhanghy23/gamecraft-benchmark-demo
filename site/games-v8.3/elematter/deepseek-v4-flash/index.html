<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Elemental Tower Defense</title>
  <script type="module" crossorigin src="./assets/index-C9tSREfN.js"></script>
  <link rel="stylesheet" crossorigin href="./assets/index-DjoP3Y2G.css">
</head>
<body>
  <div id="game-container">
    <div id="hud-top">
      <div id="lives-display" class="hud-item">Lives: <span id="lives-count">20</span></div>
      <div id="fragments-display" class="hud-item">Fragments: <span id="fragments-count">100</span></div>
      <div id="wave-display" class="hud-item">Wave: <span id="wave-current">0</span> / 20</div>
      <div id="speed-controls" class="hud-item">
        <button class="speed-btn" data-speed="1">×1</button>
        <button class="speed-btn" data-speed="2">×2</button>
        <button class="speed-btn" data-speed="3">×3</button>
      </div>
      <button id="play-btn">▶ Play</button>
      <button id="send-wave-btn" disabled>Send Wave</button>
    </div>
    <div id="playfield">
      <!-- grid tiles generated by game -->
    </div>
    <div id="hud-bottom">
      <div id="preview-container">
        <span class="preview-icon earth">0</span>
        <span class="preview-icon water">0</span>
        <span class="preview-icon air">0</span>
        <span class="preview-icon fire">0</span>
      </div>
    </div>
  </div>
</body>
</html>
