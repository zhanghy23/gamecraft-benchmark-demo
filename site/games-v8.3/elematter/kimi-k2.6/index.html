<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Elemental Tower Defense</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #1a1a2e;
      color: #fff;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }
    #game-container {
      position: relative;
      width: 1280px;
      height: 720px;
      max-width: 100vw;
      max-height: 100vh;
      background: #16213e;
      border: 2px solid #0f3460;
    }
    #top-hud {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 48px;
      background: #0f3460;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
      z-index: 10;
    }
    #bottom-hud {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 48px;
      background: #0f3460;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
      z-index: 10;
    }
    .hud-group {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .hud-item {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 14px;
    }
    .hud-icon {
      width: 20px;
      height: 20px;
      border-radius: 3px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      font-weight: bold;
    }
    .hud-btn {
      padding: 6px 14px;
      border: 1px solid #e94560;
      background: transparent;
      color: #fff;
      cursor: pointer;
      border-radius: 4px;
      font-size: 13px;
      transition: all 0.15s;
    }
    .hud-btn:hover { background: rgba(233, 69, 96, 0.2); }
    .hud-btn.active {
      background: #222;
      color: #fff;
      border-color: #222;
    }
    .hud-btn.disabled {
      opacity: 0.3;
      cursor: not-allowed;
    }
    #play-btn.active { background: #222; color: #fff; border-color: #222; }
    #send-wave-btn { opacity: 0.4; }
    #send-wave-btn.visible { opacity: 1; }
    .speed-btn { opacity: 0.4; }
    .speed-btn.active { opacity: 1; background: #222; border-color: #222; }
    #canvas {
      position: absolute;
      top: 48px;
      left: 0;
      width: 1280px;
      height: 624px;
    }
    #build-menu, #tower-menu {
      position: absolute;
      display: none;
      background: rgba(15, 52, 96, 0.95);
      border: 2px solid #e94560;
      border-radius: 8px;
      padding: 12px;
      z-index: 20;
      min-width: 180px;
    }
    #build-menu.open, #tower-menu.open { display: block; }
    .menu-title {
      font-size: 14px;
      font-weight: bold;
      margin-bottom: 8px;
      text-align: center;
    }
    .build-option {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 6px 10px;
      margin: 4px 0;
      border-radius: 4px;
      cursor: pointer;
      transition: background 0.15s;
    }
    .build-option:hover { background: rgba(233, 69, 96, 0.2); }
    .build-option.disabled {
      opacity: 0.3;
      cursor: not-allowed;
    }
    .build-color {
      width: 16px;
      height: 16px;
      border-radius: 3px;
    }
    .build-info {
      flex: 1;
      font-size: 12px;
    }
    .build-cost {
      font-size: 12px;
      font-weight: bold;
    }
    .tower-levels {
      display: flex;
      gap: 3px;
      margin-top: 6px;
      justify-content: center;
    }
    .tower-level {
      width: 16px;
      height: 6px;
      border-radius: 2px;
      background: #333;
    }
    .tower-level.lit { background: #fff; }
    .menu-btn {
      width: 100%;
      padding: 8px;
      margin: 4px 0;
      border: 1px solid #e94560;
      background: transparent;
      color: #fff;
      cursor: pointer;
      border-radius: 4px;
      font-size: 13px;
    }
    .menu-btn:hover { background: rgba(233, 69, 96, 0.2); }
    .menu-btn.unavailable {
      opacity: 0.2;
      cursor: not-allowed;
    }
    .menu-btn.unavailable:hover { background: transparent; }
    .selected-marker {
      position: absolute;
      width: 12px;
      height: 12px;
      background: #e94560;
      border-radius: 50%;
      top: -6px;
      right: -6px;
    }
    .next-wave-preview {
      display: flex;
      gap: 8px;
      font-size: 12px;
    }
    .preview-item {
      display: flex;
      align-items: center;
      gap: 3px;
    }
    .preview-dot {
      width: 10px;
      height: 10px;
      border-radius: 2px;
    }
  </style>
  <script type="module" crossorigin src="./assets/index-cJ6cSanx.js"></script>
</head>
<body>
  <div id="game-container">
    <div id="top-hud">
      <div class="hud-group">
        <div class="hud-item">
          <div class="hud-icon" style="background:#e94560;">♥</div>
          <span id="lives-display">20</span>
        </div>
        <div class="hud-item">
          <div class="hud-icon" style="background:#f9a825;">◆</div>
          <span id="fragments-display">150</span>
        </div>
        <div class="hud-item">
          <span>Wave:</span>
          <span id="wave-display">0 / 20</span>
        </div>
      </div>
      <div class="hud-group">
        <div class="next-wave-preview" id="next-wave-preview">
          <div class="preview-item"><div class="preview-dot" style="background:#4caf50;"></div><span id="next-earth">0</span></div>
          <div class="preview-item"><div class="preview-dot" style="background:#2196f3;"></div><span id="next-water">0</span></div>
          <div class="preview-item"><div class="preview-dot" style="background:#ffeb3b;"></div><span id="next-air">0</span></div>
          <div class="preview-item"><div class="preview-dot" style="background:#f44336;"></div><span id="next-fire">0</span></div>
        </div>
      </div>
    </div>
    <canvas id="canvas" width="1280" height="624"></canvas>
    <div id="bottom-hud">
      <div class="hud-group">
        <button class="hud-btn" id="play-btn">Play</button>
        <button class="hud-btn" id="send-wave-btn">Send Wave</button>
      </div>
      <div class="hud-group">
        <button class="hud-btn speed-btn active" id="speed-1">×1</button>
        <button class="hud-btn speed-btn" id="speed-2">×2</button>
        <button class="hud-btn speed-btn" id="speed-3">×3</button>
      </div>
    </div>
    <div id="build-menu">
      <div class="menu-title">Build Tower</div>
      <div id="build-options"></div>
      <div class="selected-marker" id="build-selected-marker"></div>
    </div>
    <div id="tower-menu">
      <div class="menu-title" id="tower-menu-title">Upgrade Tower</div>
      <div class="tower-levels" id="tower-levels"></div>
      <button class="menu-btn" id="upgrade-btn">Upgrade (<span id="upgrade-cost">0</span>)</button>
      <button class="menu-btn" id="reclaim-btn">Reclaim</button>
    </div>
  </div>
</body>
</html>
