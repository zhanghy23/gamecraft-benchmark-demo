<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Emoji Match-3</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      font-family: 'Segoe UI Emoji', 'Apple Color Emoji', 'Noto Color Emoji', sans-serif;
      overflow: hidden;
    }
    #game-container {
      position: relative;
      width: 100%;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    canvas {
      border-radius: 12px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.3);
    }
    #controls {
      display: flex;
      gap: 16px;
      margin-bottom: 20px;
    }
    .mode-btn {
      padding: 14px 28px;
      font-size: 18px;
      border: none;
      border-radius: 8px;
      background: linear-gradient(135deg, #ff6b6b, #ee5a24);
      color: white;
      cursor: pointer;
      font-weight: bold;
      transition: transform 0.2s, box-shadow 0.2s;
      font-family: inherit;
    }
    .mode-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(0,0,0,0.3);
    }
    .mode-btn:active {
      transform: translateY(0);
    }
  </style>
  <script type="module" crossorigin src="./assets/index-CCt_aLrJ.js"></script>
</head>
<body>
  <div id="game-container">
    <div id="controls">
      <button class="mode-btn" id="btn-levels">Levels</button>
      <button class="mode-btn" id="btn-time-attack">Time Attack</button>
      <button class="mode-btn" id="btn-endless">Endless</button>
    </div>
    <canvas id="game-canvas"></canvas>
  </div>
</body>
</html>
