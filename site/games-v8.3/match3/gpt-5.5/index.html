<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Emoji Match-3 Suite</title>
    <style>
      :root {
        color: #20304f;
        background: #f8fbff;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: linear-gradient(135deg, #fff4fd 0%, #edf7ff 45%, #f4fff0 100%);
      }
      #app {
        width: min(1180px, 98vw);
        height: min(700px, 96vh);
        display: grid;
        grid-template-rows: auto auto 1fr;
        gap: 10px;
        padding: 14px;
      }
      #controls {
        display: flex;
        justify-content: center;
        gap: 12px;
        flex-wrap: wrap;
      }
      button {
        appearance: none;
        border: 0;
        border-radius: 999px;
        padding: 10px 22px;
        font-size: 17px;
        font-weight: 800;
        color: #273657;
        background: #ffffff;
        box-shadow: 0 5px 16px rgba(58, 73, 116, 0.18), inset 0 -2px 0 rgba(58, 73, 116, 0.09);
        cursor: pointer;
      }
      button:hover, button:focus-visible {
        outline: 3px solid rgba(68, 122, 255, 0.35);
        transform: translateY(-1px);
      }
      #header {
        min-height: 34px;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 28px;
        flex-wrap: wrap;
        font-size: 22px;
        line-height: 1.2;
        font-weight: 900;
        text-shadow: 0 1px 0 #fff;
      }
      #game {
        width: 100%;
        height: 100%;
        min-height: 420px;
        border-radius: 26px;
        box-shadow: 0 16px 42px rgba(42, 61, 105, 0.18);
        background: #eef7ff;
        touch-action: none;
        display: block;
      }
    </style>
    <script type="module" crossorigin src="./assets/index-cGZyl8cL.js"></script>
  </head>
  <body>
    <div id="app">
      <div id="controls" aria-label="Game modes">
        <button id="levelsButton" type="button">Levels</button>
        <button id="timeButton" type="button">Time Attack</button>
        <button id="endlessButton" type="button">Endless</button>
      </div>
      <div id="header" aria-live="polite"></div>
      <canvas id="game" tabindex="0" aria-label="Emoji match three game board"></canvas>
    </div>
  </body>
</html>
