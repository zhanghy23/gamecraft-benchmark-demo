<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>7 Huenicorns</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      overflow: hidden;
      background: linear-gradient(180deg, #87CEEB 0%, #98D8C8 100%);
      min-height: 100vh;
    }
    #game-container {
      width: 100vw;
      height: 100vh;
      position: relative;
    }
    canvas {
      display: block;
    }
    .overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(0,0,0,0.5);
      z-index: 100;
    }
    .modal {
      background: linear-gradient(135deg, #FFF8E7 0%, #FFE4B5 100%);
      border-radius: 20px;
      padding: 30px 40px;
      max-width: 600px;
      max-height: 80vh;
      overflow-y: auto;
      box-shadow: 0 10px 40px rgba(0,0,0,0.3);
      border: 4px solid #FFD700;
    }
    .modal h2 {
      color: #8B4513;
      text-align: center;
      margin-bottom: 20px;
      font-size: 28px;
      text-shadow: 2px 2px 0 rgba(255,255,255,0.5);
    }
    .modal p, .modal li {
      color: #5D4037;
      line-height: 1.6;
      margin-bottom: 10px;
    }
    .modal ul {
      margin-left: 20px;
      margin-bottom: 15px;
    }
    .btn {
      background: linear-gradient(135deg, #FF69B4 0%, #FF1493 100%);
      color: white;
      border: none;
      padding: 12px 24px;
      border-radius: 25px;
      font-size: 16px;
      cursor: pointer;
      margin: 5px;
      transition: transform 0.2s, box-shadow 0.2s;
      box-shadow: 0 4px 15px rgba(255,105,180,0.4);
    }
    .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(255,105,180,0.6);
    }
    .btn:disabled {
      background: #ccc;
      cursor: not-allowed;
      transform: none;
      box-shadow: none;
    }
    .btn-secondary {
      background: linear-gradient(135deg, #9370DB 0%, #8A2BE2 100%);
      box-shadow: 0 4px 15px rgba(147,112,219,0.4);
    }
    .btn-secondary:hover {
      box-shadow: 0 6px 20px rgba(147,112,219,0.6);
    }
    .link {
      color: #FF69B4;
      cursor: pointer;
      text-decoration: underline;
      font-size: 18px;
      display: block;
      text-align: center;
      margin: 10px 0;
    }
    .link:hover {
      color: #FF1493;
    }
    input[type="text"] {
      padding: 10px 15px;
      border-radius: 10px;
      border: 2px solid #FFD700;
      font-size: 16px;
      width: 150px;
      text-align: center;
    }
    .checkbox-container {
      display: flex;
      align-items: center;
      justify-content: center;
      margin-top: 20px;
      gap: 10px;
      color: #5D4037;
    }
    input[type="checkbox"] {
      width: 20px;
      height: 20px;
      cursor: pointer;
    }
    .step-heading {
      color: #8B4513;
      font-weight: bold;
      margin-top: 15px;
      font-size: 18px;
    }
    .example-box {
      background: rgba(255,255,255,0.7);
      padding: 15px;
      border-radius: 10px;
      margin: 10px 0;
    }
    .game-over-result {
      font-size: 48px;
      text-align: center;
      margin: 20px 0;
    }
    .waiting-text {
      text-align: center;
      color: #8B4513;
      font-style: italic;
    }
  </style>
  <script type="module" crossorigin src="./assets/index-Dj3eCUUL.js"></script>
</head>
<body>
  <div id="game-container">
    <canvas id="game-canvas"></canvas>
  </div>
</body>
</html>
