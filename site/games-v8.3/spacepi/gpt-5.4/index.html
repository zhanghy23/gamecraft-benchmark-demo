<!doctype html>
<html lang="en">
<head>

  <title>SpacePi</title>
  <style>
    html,body{margin:0;height:100%;background:#050814;color:#eaf6ff;font-family:Arial,Helvetica,sans-serif;overflow:hidden}

    canvas{position:absolute;inset:0;width:100%;height:100%;display:block;background:#020611;cursor:crosshair}
    #overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none}
    .panel{pointer-events:auto;max-width:86%;max-height:90%;overflow:auto;background:rgba(4,10,24,.94);border:2px solid #79d5ff;border-radius:14px;padding:18px 24px;box-shadow:0 0 28px rgba(69,190,255,.35);text-align:center}

    p{line-height:1.35}.row{display:flex;gap:10px;align-items:center;justify-content:center;flex-wrap:wrap}.grid{display:grid;grid-template-columns:repeat(13,minmax(54px,1fr));gap:7px;margin:10px 0 16px}.upgrades{display:grid;grid-template-columns:1fr;gap:7px;margin-top:8px}.levelBtn,.upgradeBtn,button{background:#142849;color:#eaf6ff;border:1px solid #79d5ff;border-radius:8px;padding:8px 12px;font-weight:bold;cursor:pointer}button:hover,.levelBtn:hover,.upgradeBtn:hover{background:#1f3d70}.disabled{opacity:.42;filter:grayscale(.7);cursor:not-allowed}.levelBtn{min-height:62px}.scoreArea{font-size:12px;color:#d8ecff;margin-top:3px}.perfect{display:inline-block;margin-left:3px;color:#8cff9d;text-shadow:0 0 8px #36ff50}.funds{font-size:22px;font-weight:bold;color:#aaffca}.funds.notEnough{color:#ff5b5b;text-shadow:0 0 10px #ff2020}.guide{display:flex;gap:22px;justify-content:center;align-items:center;margin:10px 0}.sample{width:170px;height:72px;border:1px solid #35547e;border-radius:8px;background:#07142a;position:relative}.lineSample{position:absolute;height:5px;border-radius:5px;transform-origin:left center;left:32px;top:34px}.defensive{width:105px;background:#64ff8b;transform:rotate(-17deg);box-shadow:0 0 9px #64ff8b}.enemy{width:110px;background:#ff5366;transform:rotate(19deg);box-shadow:0 0 9px #ff5366}.statTable{display:grid;grid-template-columns:auto auto auto;gap:8px 18px;text-align:left;margin:12px auto;max-width:620px}.note{color:#ffe28a}.good{color:#8cff9d}.bad{color:#ff7777}
