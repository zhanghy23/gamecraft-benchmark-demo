<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SpacePi</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #000;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      overflow: hidden;
    }
    #game-container {
      position: relative;
      width: 1280px;
      height: 720px;
      max-width: 100vw;
      max-height: 100vh;
    }
    canvas {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      display: block;
    }
    #ui-overlay {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      pointer-events: none;
    }
    #ui-overlay > div {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      color: white;
      font-family: monospace;
      pointer-events: auto;
      background: rgba(0,0,0,0.85);
      z-index: 10;
    }
    #ui-overlay > div.hidden {
      display: none;
    }
    #hud {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      pointer-events: none;
      z-index: 5;
      color: white;
      font-family: monospace;
      font-size: 18px;
      text-shadow: 1px 1px 0 #000;
    }
    #hud.hidden { display: none; }
    .menu-title { font-size: 48px; font-weight: bold; margin-bottom: 30px; }
    .btn {
      background: #333;
      color: #fff;
      border: 2px solid #aaa;
      padding: 12px 24px;
      margin: 8px;
      font-size: 20px;
      font-family: monospace;
      cursor: pointer;
      text-align: center;
      user-select: none;
    }
    .btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }
    .btn:hover:not(:disabled) {
      background: #555;
    }
    .level-btn {
      display: inline-flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      width: 80px;
      height: 80px;
      margin: 6px;
      font-size: 14px;
      border: 2px solid #aaa;
      background: #222;
    }
    .level-btn.enabled { border-color: #0f0; }
    .level-btn.disabled { border-color: #f00; opacity: 0.5; }
    .perfect-marker { color: gold; font-weight: bold; }
    .funds-display { font-size: 24px; margin: 10px; }
    .red-flash { color: red !important; }
    .upgrade-row { display: flex; align-items: center; margin: 6px; font-size: 18px; }
    .upgrade-row button { margin-left: 12px; }
    .meter-track { background: #333; width: 200px; height: 20px; border: 1px solid #aaa; }
    .meter-fill { background: #0f0; height: 100%; }
    .overlay-text { font-size: 72px; color: white; text-shadow: 0 0 20px #000; }
    .guide-map { display: flex; align-items: center; justify-content: center; margin: 20px; }
    .guide-map svg { background: #111; }
  </style>
  <script type="module" crossorigin src="./assets/index-CUZP2hyP.js"></script>
</head>
<body>
  <div id="game-container">
    <canvas id="gameCanvas"></canvas>
    <div id="hud" class="hidden">
      <div style="position:absolute; top:10px; left:10px;">
        <div id="completion-text"></div>
        <div class="meter-track"><div id="completion-meter" class="meter-fill" style="width:0%"></div></div>
        <div id="power-text"></div>
        <div class="meter-track"><div id="power-meter" class="meter-fill" style="width:0%"></div></div>
        <div id="score-text"></div>
      </div>
      <div style="position:absolute; top:10px; right:10px; text-align:right;">
        <div id="profit-display"></div>
      </div>
      <div id="powerup-display" style="position:absolute; bottom:10px; left:50%; transform:translateX(-50%); text-align:center; font-size:20px;"></div>
    </div>
    <div id="ui-overlay">
      <div id="main-menu">
        <div class="menu-title">SpacePi</div>
        <div id="overview">
          <p>Defend your growing base from incoming enemy lines.</p>
          <p>Drag with mouse to draw defensive lines, collect coins and powerups.</p>
        </div>
        <div class="guide-map">
          <svg width="300" height="150">
            <circle cx="150" cy="120" r="30" fill="none" stroke="cyan" stroke-width="2"/>
            <text x="150" y="120" text-anchor="middle" fill="cyan" font-size="12">Base</text>
            <line x1="150" y1="0" x2="150" y2="90" stroke="red" stroke-width="3">
              <animate attributeName="opacity" values="1;0.3;1" dur="0.8s" repeatCount="indefinite"/>
            </line>
            <text x="160" y="40" fill="red" font-size="12">Enemy Line</text>
            <line x1="200" y1="50" x2="260" y2="100" stroke="lime" stroke-width="3"/>
            <text x="270" y="80" fill="lime" font-size="12">Defensive Line</text>
          </svg>
        </div>
        <button class="btn" id="play-game-btn">Play Game</button>
        <button class="btn" id="overall-stats-btn">Overall Stats</button>
        <button class="btn" id="reset-game-btn">Reset Game Data</button>
      </div>
      <div id="level-select-menu" class="hidden">
        <div class="menu-title">Select Level</div>
        <div id="level-status-line"></div>
        <div id="level-buttons"></div>
        <div id="funds-display" class="funds-display"></div>
        <div id="upgrades-section"></div>
        <button class="btn" id="return-menu-btn">Return to Menu</button>
      </div>
      <div id="pause-menu" class="hidden">
        <div class="menu-title" id="pause-heading">Level Paused</div>
        <button class="btn" id="resume-btn">Resume Level</button>
        <button class="btn" id="quit-level-btn">Quit Level</button>
      </div>
      <div id="level-stats-menu" class="hidden">
        <div class="menu-title" id="stats-status"></div>
        <div id="stats-content"></div>
        <button class="btn" id="retry-btn" style="display:none;">Retry Level</button>
        <button class="btn" id="return-upgrades-btn">Return to Upgrades/Levels</button>
      </div>
    </div>
  </div>
</body>
</html>
