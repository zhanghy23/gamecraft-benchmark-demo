<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lost Antenna Adventure</title>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    body { background:#000; overflow:hidden; font-family: monospace; }
    canvas { display:block; width:100vw; height:100vh; }
    #ui { position:absolute; top:0; left:0; width:100%; height:100%; pointer-events:none; }
    #menu { position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); background:rgba(0,0,0,0.85); padding:48px; border:2px solid #fff; color:#fff; text-align:center; pointer-events:auto; }
    #menu button { background:#222; border:1px solid #fff; color:#fff; padding:12px 32px; margin:8px; cursor:pointer; font-family:monospace; font-size:16px; }
    #crosshair { position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); width:16px; height:16px; border:2px solid rgba(255,255,255,0.5); border-radius:50%; }
    #message { position:absolute; bottom:120px; left:50%; transform:translateX(-50%); color:#fff; font-size:18px; text-align:center; background:rgba(0,0,0,0.7); padding:12px 24px; border-radius:4px; max-width:700px; }
    #interact { position:absolute; bottom:60px; left:50%; transform:translateX(-50%); color:#ffff99; font-size:16px; }
    .hidden { display:none !important; }
  </style>
  <script type="module" crossorigin src="./assets/index-CjVCiOr3.js"></script>
</head>
<body>
  <canvas id="game"></canvas>
  <div id="ui">
    <div id="crosshair"></div>
    <div id="message"></div>
    <div id="interact"></div>
    <div id="menu" class="hidden">
      <h1>Lost Antenna</h1>
      <br>
      <button id="startBtn">Start Game</button>
      <br><br>
      <p>WASD to move, Mouse look, E to interact</p>
    </div>
  </div>
</body>
</html>
