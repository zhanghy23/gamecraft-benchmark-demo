<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lost Antenna Adventure</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      background: #000;
      overflow: hidden;
      font-family: 'Courier New', monospace;
    }
    #game-container {
      position: relative;
      width: 100%;
      height: 100%;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }
    #ui-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }
    #crosshair {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 4px;
      height: 4px;
      background: rgba(255,255,255,0.7);
      border-radius: 50%;
      transform: translate(-50%, -50%);
    }
    #interaction-text {
      position: absolute;
      bottom: 80px;
      left: 50%;
      transform: translateX(-50%);
      color: #fff;
      font-size: 14px;
      text-align: center;
      text-shadow: 1px 1px 2px #000;
      max-width: 600px;
      min-height: 20px;
    }
    #message-text {
      position: absolute;
      bottom: 120px;
      left: 50%;
      transform: translateX(-50%);
      color: #0f0;
      font-size: 14px;
      text-align: center;
      text-shadow: 1px 1px 2px #000;
      max-width: 600px;
      min-height: 20px;
    }
    #inventory {
      position: absolute;
      top: 20px;
      right: 20px;
      color: #fff;
      font-size: 12px;
      text-shadow: 1px 1px 2px #000;
    }
    #menu-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.85);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      pointer-events: auto;
    }
    #menu-overlay.hidden {
      display: none;
    }
    #menu-title {
      color: #fff;
      font-size: 36px;
      margin-bottom: 40px;
      text-shadow: 2px 2px 4px #000;
    }
    .menu-button {
      padding: 12px 40px;
      margin: 10px;
      font-size: 18px;
      font-family: 'Courier New', monospace;
      background: #333;
      color: #fff;
      border: 2px solid #666;
      cursor: pointer;
      transition: all 0.2s;
    }
    .menu-button:hover {
      background: #555;
      border-color: #888;
    }
    #ending-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.9);
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      pointer-events: none;
    }
    #ending-overlay.visible {
      display: flex;
    }
    .ending-text {
      color: #fff;
      font-size: 24px;
      margin: 8px;
      text-shadow: 2px 2px 4px #000;
      text-align: center;
    }
    .ending-title {
      font-size: 48px;
      margin-bottom: 20px;
    }
    #minigame-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: none;
      pointer-events: auto;
      background: rgba(0,0,0,0.7);
    }
    #minigame-overlay.visible {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    #console-screen {
      width: 640px;
      height: 480px;
      background: #0a0a0a;
      border: 4px solid #444;
      position: relative;
      overflow: hidden;
    }
  </style>
  <script type="module" crossorigin src="./assets/index-uxoMGK1t.js"></script>
</head>
<body>
  <div id="game-container">
    <canvas id="game-canvas"></canvas>
    <div id="ui-overlay">
      <div id="crosshair"></div>
      <div id="message-text"></div>
      <div id="interaction-text"></div>
      <div id="inventory"></div>
    </div>
    <div id="menu-overlay" class="hidden">
      <div id="menu-title">Lost Antenna Adventure</div>
      <button id="start-button" class="menu-button">Start Game</button>
    </div>
    <div id="minigame-overlay">
      <div id="console-screen">
        <canvas id="console-canvas" width="640" height="480"></canvas>
      </div>
    </div>
    <div id="ending-overlay">
      <div class="ending-text ending-title">The End</div>
      <div class="ending-text">you found your way out</div>
      <div class="ending-text">Game by Salvatore Previti & Ben Clark</div>
      <div class="ending-text">Thank you for playing!</div>
    </div>
  </div>
</body>
</html>
