<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tiny Yurts</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      overflow: hidden;
      background: #4a7c59;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      user-select: none;
    }
    #game-container {
      width: 100vw;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #4a7c59;
      position: relative;
    }
    #playfield {
      position: relative;
      width: 1280px;
      height: 720px;
      max-width: 100vw;
      max-height: 100vh;
    }
    svg {
      width: 100%;
      height: 100%;
      display: block;
    }
    .overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: rgba(0,0,0,0.7);
      z-index: 100;
      transition: opacity 0.5s;
    }
    .overlay.hidden {
      opacity: 0;
      pointer-events: none;
    }
    .overlay h1 {
      color: #f0e6d2;
      font-size: 48px;
      margin-bottom: 20px;
      text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
    }
    .overlay p {
      color: #d4c5a9;
      font-size: 16px;
      margin-bottom: 10px;
      max-width: 500px;
      text-align: center;
      line-height: 1.5;
    }
    .overlay button {
      margin: 8px;
      padding: 12px 32px;
      font-size: 18px;
      background: #8b6914;
      color: #f0e6d2;
      border: 2px solid #d4a843;
      border-radius: 8px;
      cursor: pointer;
      transition: background 0.2s;
    }
    .overlay button:hover {
      background: #a67c1a;
    }
    #hud {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 50;
    }
    .hud-element {
      position: absolute;
      pointer-events: auto;
    }
    #score-counters {
      top: 10px;
      left: 10px;
      display: flex;
      gap: 15px;
      opacity: 0;
      transition: opacity 0.5s;
    }
    #score-counters.visible {
      opacity: 1;
    }
    .counter {
      display: flex;
      align-items: center;
      gap: 5px;
      background: rgba(0,0,0,0.5);
      padding: 5px 10px;
      border-radius: 5px;
      color: #f0e6d2;
      font-size: 14px;
    }
    .counter-icon {
      width: 20px;
      height: 20px;
    }
    #path-indicator {
      top: 10px;
      right: 10px;
      background: rgba(0,0,0,0.5);
      padding: 8px 15px;
      border-radius: 5px;
      color: #f0e6d2;
      font-size: 18px;
      font-weight: bold;
      opacity: 0;
      transition: opacity 0.5s;
    }
    #path-indicator.visible {
      opacity: 1;
    }
    #clock-display {
      top: 50px;
      right: 10px;
      background: rgba(0,0,0,0.5);
      padding: 8px 15px;
      border-radius: 5px;
      color: #f0e6d2;
      font-size: 16px;
      display: flex;
      align-items: center;
      gap: 8px;
      opacity: 0;
      transition: opacity 0.5s;
    }
    #clock-display.visible {
      opacity: 1;
    }
    #clock-svg {
      width: 30px;
      height: 30px;
    }
    #pause-control {
      bottom: 10px;
      right: 10px;
      width: 40px;
      height: 40px;
      background: rgba(0,0,0,0.5);
      border-radius: 5px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      opacity: 0;
      transition: opacity 0.5s;
    }
    #pause-control.visible {
      opacity: 1;
    }
    #pause-control svg {
      width: 24px;
      height: 24px;
    }
    #grid-controls {
      bottom: 10px;
      left: 10px;
      display: flex;
      gap: 10px;
    }
    .grid-btn {
      width: 40px;
      height: 40px;
      background: rgba(0,0,0,0.5);
      border-radius: 5px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      border: 2px solid transparent;
    }
    .grid-btn.active {
      border-color: #d4a843;
    }
    .grid-btn svg {
      width: 24px;
      height: 24px;
    }
    #sound-control {
      bottom: 10px;
      right: 60px;
      width: 40px;
      height: 40px;
      background: rgba(0,0,0,0.5);
      border-radius: 5px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }
    .warning-marker {
      animation: pulse 1s infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }
  </style>
  <script type="module" crossorigin src="./assets/index-B1XA_MXc.js"></script>
</head>
<body>
  <div id="game-container">
    <div id="playfield">
      <svg id="game-svg" viewBox="0 0 1280 720" preserveAspectRatio="xMidYMid meet">
        <defs>
          <filter id="pond-blur">
            <feGaussianBlur stdDeviation="3"/>
          </filter>
        </defs>
        <g id="camera-group">
          <rect id="bg-rect" x="-200" y="-200" width="1680" height="1120" fill="#5a8f6a"/>
          <g id="grid-layer"></g>
          <g id="pond-layer"></g>
          <g id="path-layer"></g>
          <g id="farm-layer"></g>
          <g id="yurt-layer"></g>
          <g id="tree-layer"></g>
          <g id="animal-layer"></g>
          <g id="person-layer"></g>
          <g id="drag-layer"></g>
          <g id="warning-layer"></g>
        </g>
      </svg>
      <div id="hud">
        <div id="score-counters" class="hud-element">
          <div class="counter" id="ox-counter">
            <svg class="counter-icon" viewBox="0 0 20 20"><circle cx="10" cy="10" r="8" fill="#8b4513"/></svg>
            <span id="ox-count">0</span>
          </div>
          <div class="counter" id="goat-counter">
            <svg class="counter-icon" viewBox="0 0 20 20"><circle cx="10" cy="10" r="8" fill="#d4a843"/></svg>
            <span id="goat-count">0</span>
          </div>
          <div class="counter" id="fish-counter">
            <svg class="counter-icon" viewBox="0 0 20 20"><ellipse cx="10" cy="10" rx="8" ry="5" fill="#4682b4"/></svg>
            <span id="fish-count">0</span>
          </div>
        </div>
        <div id="path-indicator" class="hud-element">18</div>
        <div id="clock-display" class="hud-element">
          <span id="month-text">Jan</span>
          <svg id="clock-svg" viewBox="0 0 30 30">
            <circle cx="15" cy="15" r="13" fill="none" stroke="#f0e6d2" stroke-width="2"/>
            <line id="clock-hand" x1="15" y1="15" x2="15" y2="5" stroke="#f0e6d2" stroke-width="2" stroke-linecap="round"/>
          </svg>
        </div>
        <div id="pause-control" class="hud-element">
          <svg id="pause-icon" viewBox="0 0 24 24">
            <rect x="6" y="4" width="4" height="16" fill="#f0e6d2"/>
            <rect x="14" y="4" width="4" height="16" fill="#f0e6d2"/>
          </svg>
        </div>
        <div id="grid-controls" class="hud-element">
          <div id="grid-btn" class="grid-btn" title="Toggle Grid">
            <svg viewBox="0 0 24 24">
              <path d="M3 3h18v18H3V3zm4 4v10M9 3v18M15 3v18m4-14H3m18 4H3" stroke="#f0e6d2" stroke-width="2" fill="none"/>
            </svg>
          </div>
          <div id="red-grid-btn" class="grid-btn" title="Delete Mode">
            <svg viewBox="0 0 24 24">
              <rect x="3" y="3" width="18" height="18" rx="2" stroke="#ff6b6b" stroke-width="2" fill="none"/>
              <line x1="8" y1="8" x2="16" y2="16" stroke="#ff6b6b" stroke-width="2"/>
              <line x1="16" y1="8" x2="8" y2="16" stroke="#ff6b6b" stroke-width="2"/>
            </svg>
          </div>
        </div>
        <div id="sound-control" class="hud-element">
          <svg id="sound-icon" viewBox="0 0 24 24" width="24" height="24">
            <path d="M3 9v6h4l5 5V4L7 9H3z" fill="#f0e6d2"/>
            <path d="M16 8a5 5 0 010 8M19 5a9 9 0 010 14" stroke="#f0e6d2" stroke-width="2" fill="none"/>
          </svg>
        </div>
      </div>
      <div id="menu-overlay" class="overlay">
        <h1>Tiny Yurts</h1>
        <p id="menu-tip">Tip: Left click &amp; drag to connect yurts to<br>farms, or delete paths with right click.</p>
        <button id="fullscreen-btn">Fullscreen</button>
        <button id="start-btn">Start</button>
      </div>
      <div id="gameover-overlay" class="overlay hidden">
        <h1>Game Over</h1>
        <p id="gameover-reason">Too few people could tend to this farm in time.</p>
        <p id="gameover-score">Score: 0</p>
        <div id="gameover-stats" style="display:flex;gap:20px;margin:15px 0;">
          <div class="counter"><svg class="counter-icon" viewBox="0 0 20 20"><circle cx="10" cy="10" r="8" fill="#8b4513"/></svg><span>×</span><span id="go-ox">0</span></div>
          <div class="counter"><svg class="counter-icon" viewBox="0 0 20 20"><circle cx="10" cy="10" r="8" fill="#d4a843"/></svg><span>×</span><span id="go-goat">0</span></div>
          <div class="counter"><svg class="counter-icon" viewBox="0 0 20 20"><ellipse cx="10" cy="10" rx="8" ry="5" fill="#4682b4"/></svg><span>×</span><span id="go-fish">0</span></div>
        </div>
        <p id="gameover-settlers">0 settlers</p>
        <button id="overlay-toggle-btn">Overlay On/Off</button>
        <button id="restart-btn">Restart</button>
        <button id="menu-btn">Menu</button>
      </div>
    </div>
  </div>
</body>
</html>
